<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>타이어 공장도 검색</title>
<meta name="description" content="타이어 공장도 가격 비교 검색 — 미쉐린, 콘티넨탈, 한국타이어, 금호, 라우펜, 굿이어, 제너럴 브랜드별 최저가 비교">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a1628;--bg2:#111d33;--bg3:#182640;--accent:#3b82f6;--accent2:#60a5fa;--text:#f1f5f9;--text2:#94a3b8;--card:#131f35;--border:#1e3050;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* Header */
.header{background:linear-gradient(135deg,#0f2035 0%,#162a4a 100%);padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.header h1{font-size:1.3rem;font-weight:700;margin-bottom:12px;letter-spacing:-0.5px}
.header h1 span{color:var(--accent2)}

/* Search */
.search-wrap{position:relative;max-width:480px;margin:0 auto}
.search-wrap input{width:100%;padding:14px 48px 14px 16px;border-radius:12px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1.05rem;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text2)}
.search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--accent);border:none;border-radius:8px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.search-btn:hover{background:var(--accent2)}
.search-btn svg{width:20px;height:20px;fill:white}
.clear-btn{position:absolute;right:50px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem;display:none;padding:4px}

/* Recent searches */
.recent{max-width:480px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.recent-label{font-size:.75rem;color:var(--text2)}
.recent-tag{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:16px;font-size:.75rem;cursor:pointer;transition:all .2s}
.recent-tag:hover{background:var(--accent);color:white;border-color:var(--accent)}

/* Brand Tabs */
.brand-tabs{display:flex;overflow-x:auto;gap:8px;padding:12px 16px;max-width:600px;margin:0 auto;scrollbar-width:none;-ms-overflow-style:none}
.brand-tabs::-webkit-scrollbar{display:none}
.brand-tab{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:.85rem;cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:500}
.brand-tab.active{background:var(--accent);color:white;border-color:var(--accent)}
.brand-tab:hover:not(.active){background:var(--bg3);color:var(--text)}
.brand-tab .count{margin-left:4px;font-size:.7rem;opacity:.7}

/* Stats bar */
.stats-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;max-width:600px;margin:0 auto;font-size:.8rem;color:var(--text2)}
.stats-bar .result-count{font-weight:600;color:var(--accent2)}
.sort-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:6px;font-size:.75rem;cursor:pointer}
.sort-btn:hover{color:var(--text);border-color:var(--text2)}

/* Cards */
.results{padding:0 16px 16px;max-width:600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 20px rgba(59,130,246,.15)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-brand{font-size:.75rem;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px}
.card-oem{font-size:.65rem;background:var(--bg3);padding:2px 8px;border-radius:4px;color:var(--orange)}
.card-pattern{font-size:1.05rem;font-weight:700;margin-bottom:4px;line-height:1.3}
.card-size{font-size:.9rem;color:var(--text2);margin-bottom:10px;font-family:'Courier New',monospace;font-weight:600}
.card-bottom{display:flex;justify-content:space-between;align-items:flex-end}
.card-price{font-size:1.4rem;font-weight:800;color:var(--green)}
.card-price small{font-size:.75rem;font-weight:400;color:var(--text2);margin-left:2px}
.card-per4{font-size:.8rem;color:var(--text2)}
.card-per4 b{color:var(--text);font-weight:600}

/* Discount Calculator */
.calc-toggle{display:none;text-align:center;padding:8px}
.calc-toggle-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 20px;border-radius:20px;font-size:.85rem;cursor:pointer;transition:all .2s}
.calc-toggle-btn:hover{color:var(--text);border-color:var(--accent)}
.calc-panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:8px 16px;max-width:568px;margin-left:auto;margin-right:auto}
.calc-panel.show{display:block}
.calc-panel h3{font-size:.9rem;margin-bottom:12px;color:var(--accent2)}
.calc-row{display:flex;gap:10px;margin-bottom:10px}
.calc-row label{font-size:.8rem;color:var(--text2);display:block;margin-bottom:4px}
.calc-row input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem;outline:none}
.calc-row input:focus{border-color:var(--accent)}
.calc-result{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.calc-result .final-price{font-size:1.5rem;font-weight:800;color:var(--green)}
.calc-result .detail{font-size:.8rem;color:var(--text2);margin-top:4px}

/* Empty / Loading */
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty h3{font-size:1.1rem;margin-bottom:8px;color:var(--text)}
.empty p{font-size:.9rem;line-height:1.5}
.loading{text-align:center;padding:40px;color:var(--text2)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Popular sizes */
.popular{padding:16px;max-width:600px;margin:0 auto}
.popular h3{font-size:.9rem;color:var(--text2);margin-bottom:10px}
.popular-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.popular-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.popular-item:hover{border-color:var(--accent);background:var(--bg3)}
.popular-item .size{font-size:.95rem;font-weight:700;font-family:'Courier New',monospace}
.popular-item .label{font-size:.7rem;color:var(--text2);margin-top:4px}

/* Footer */
.footer{text-align:center;padding:30px 16px;color:var(--text2);font-size:.75rem;border-top:1px solid var(--border);margin-top:20px}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

/* Mobile tweaks */
@media(max-width:400px){
  .header h1{font-size:1.15rem}
  .popular-grid{grid-template-columns:repeat(2,1fr)}
  .card-price{font-size:1.2rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 타이어 <span>공장도</span> 검색</h1>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="사이즈 입력 (예: 2355519, 235/55R19)" inputmode="text" autocomplete="off">
    <button class="clear-btn" id="clearBtn" title="지우기">✕</button>
    <button class="search-btn" id="searchBtn" title="검색">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </div>
  <div class="recent" id="recentArea"></div>
</div>

<div class="brand-tabs" id="brandTabs"></div>

<div class="stats-bar" id="statsBar" style="display:none">
  <span>검색 결과 <span class="result-count" id="resultCount">0</span>개</span>
  <button class="sort-btn" id="sortBtn" title="정렬 변경">가격 ↑</button>
</div>

<div class="calc-toggle" id="calcToggle">
  <button class="calc-toggle-btn" id="calcToggleBtn">🧮 할인 계산기</button>
</div>

<div class="calc-panel" id="calcPanel">
  <h3>🧮 할인율 계산기</h3>
  <div class="calc-row">
    <div style="flex:1"><label>기준 가격 (원)</label><input type="number" id="calcPrice" placeholder="카드 클릭 시 자동입력"></div>
    <div style="flex:1"><label>수량 (개)</label><input type="number" id="calcQty" value="4" min="1" max="20"></div>
  </div>
  <div class="calc-row">
    <div style="flex:1"><label>할인율 (%)</label><input type="number" id="calcDiscount" value="0" min="0" max="100" step="0.5"></div>
  </div>
  <div class="calc-result">
    <div class="final-price" id="calcFinal">0 원</div>
    <div class="detail" id="calcDetail">개당 0원 × 4개</div>
  </div>
</div>

<div id="resultsArea">
  <div class="popular" id="popularArea">
    <h3>📌 인기 사이즈</h3>
    <div class="popular-grid">
      <div class="popular-item" onclick="searchSize('225/45R17')"><div class="size">225/45R17</div><div class="label">준중형 세단</div></div>
      <div class="popular-item" onclick="searchSize('205/55R16')"><div class="size">205/55R16</div><div class="label">중형 세단</div></div>
      <div class="popular-item" onclick="searchSize('235/55R19')"><div class="size">235/55R19</div><div class="label">중형 SUV</div></div>
      <div class="popular-item" onclick="searchSize('245/45R18')"><div class="size">245/45R18</div><div class="label">대형 세단</div></div>
      <div class="popular-item" onclick="searchSize('235/60R18')"><div class="size">235/60R18</div><div class="label">SUV</div></div>
      <div class="popular-item" onclick="searchSize('225/55R17')"><div class="size">225/55R17</div><div class="label">중형 세단</div></div>
    </div>
  </div>
</div>

<div class="results" id="cardList"></div>

<div class="footer">
  타이어 공장도 가격 비교 검색<br>
  <span style="font-size:.65rem;margin-top:4px;display:inline-block">가격은 공장도 기준이며 실제 판매가와 다를 수 있습니다</span>
</div>

<script>
// === State ===
let allData = [];
let filtered = [];
let activeBrand = '전체';
let sortAsc = true;
let currentQuery = '';
const DATA_FILES = [
  'michelin-data.json',
  'continental-data.json',
  'hankook-data.json',
  'kumho-data.json',
  'general-data.json',
  'goodyear-data.json',
  'laufenn-data.json'
];
const BRAND_MAP = {
  '전체': null,
  '미쉐린': '미쉐린',
  '콘티넨탈': '콘티넨탈',
  '한국타이어': '한국타이어',
  '금호': '금호',
  '라우펜': '라우펜',
  '굿이어': '굿이어',
  '제너럴': ['제너럴','제네럴']
};

// === Load Data ===
async function loadData() {
  const cardList = document.getElementById('cardList');
  cardList.innerHTML = '<div class="loading"><div class="spinner"></div>데이터 로딩 중...</div>';
  try {
    const results = await Promise.all(DATA_FILES.map(f => fetch(f).then(r => r.json()).catch(() => [])));
    allData = results.flat();
    cardList.innerHTML = '';
    buildBrandTabs();
    loadRecent();
  } catch(e) {
    cardList.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>데이터 로딩 실패</h3><p>페이지를 새로고침 해주세요</p></div>';
  }
}

// === Normalize size string to digits only ===
function normalizeSize(s) {
  return s.replace(/[^0-9]/g, '');
}

// === Search ===
function doSearch(query) {
  query = query.trim();
  if (!query) {
    filtered = [];
    currentQuery = '';
    renderCards();
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('calcToggle').style.display = 'none';
    document.getElementById('popularArea').style.display = '';
    return;
  }
  currentQuery = query;
  const norm = normalizeSize(query);
  
  if (norm.length < 3) {
    // Too short - try pattern/model search instead
    filtered = allData.filter(d => {
      const pat = d.pattern.toLowerCase();
      const q = query.toLowerCase();
      return pat.includes(q);
    });
  } else {
    // Size search - match by normalized digits
    filtered = allData.filter(d => {
      const sizeNorm = normalizeSize(d.size);
      return sizeNorm.includes(norm);
    });
  }
  
  // Apply brand filter
  applyBrandFilter();
  saveRecent(query);
  document.getElementById('popularArea').style.display = 'none';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('calcToggle').style.display = 'block';
  updateBrandCounts();
}

function applyBrandFilter() {
  let data = filtered;
  if (activeBrand !== '전체') {
    const bval = BRAND_MAP[activeBrand];
    if (Array.isArray(bval)) {
      data = data.filter(d => bval.includes(d.brand));
    } else {
      data = data.filter(d => d.brand === bval);
    }
  }
  // Sort
  data.sort((a, b) => sortAsc ? a.price - b.price : b.price - a.price);
  renderCards(data);
}

// === Render Cards ===
function renderCards(data) {
  const list = document.getElementById('cardList');
  const count = document.getElementById('resultCount');
  
  if (!data || data.length === 0) {
    if (currentQuery) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><h3>검색 결과 없음</h3><p>다른 사이즈로 검색해 보세요<br>예: 2055516, 225/45R17</p></div>';
      count.textContent = '0';
    } else {
      list.innerHTML = '';
    }
    return;
  }
  
  count.textContent = data.length;
  
  // Limit render for performance
  const MAX = 200;
  const items = data.slice(0, MAX);
  
  let html = '';
  items.forEach((d, i) => {
    const priceStr = d.price.toLocaleString();
    const per4 = (d.price * 4).toLocaleString();
    const oem = d.oem && d.oem.trim() ? `<span class="card-oem">${d.oem.trim()}</span>` : '';
    html += `<div class="card" onclick="setCalcPrice(${d.price})">
      <div class="card-top">
        <span class="card-brand">${d.brand}</span>
        ${oem}
      </div>
      <div class="card-pattern">${d.pattern}</div>
      <div class="card-size">${d.size}</div>
      <div class="card-bottom">
        <div class="card-price">${priceStr}<small>원</small></div>
        <div class="card-per4">4개 <b>${per4}</b>원</div>
      </div>
    </div>`;
  });
  
  if (data.length > MAX) {
    html += `<div class="empty"><p>외 ${data.length - MAX}개 결과가 더 있습니다.<br>사이즈를 더 구체적으로 입력해 주세요.</p></div>`;
  }
  
  list.innerHTML = html;
}

// === Brand Tabs ===
function buildBrandTabs() {
  const tabs = document.getElementById('brandTabs');
  const brands = Object.keys(BRAND_MAP);
  tabs.innerHTML = brands.map(b => 
    `<div class="brand-tab${b === activeBrand ? ' active' : ''}" data-brand="${b}">${b}<span class="count"></span></div>`
  ).join('');
  tabs.addEventListener('click', e => {
    const tab = e.target.closest('.brand-tab');
    if (!tab) return;
    activeBrand = tab.dataset.brand;
    tabs.querySelectorAll('.brand-tab').forEach(t => t.classList.toggle('active', t.dataset.brand === activeBrand));
    applyBrandFilter();
  });
}

function updateBrandCounts() {
  const tabs = document.getElementById('brandTabs');
  tabs.querySelectorAll('.brand-tab').forEach(tab => {
    const b = tab.dataset.brand;
    let cnt;
    if (b === '전체') {
      cnt = filtered.length;
    } else {
      const bval = BRAND_MAP[b];
      if (Array.isArray(bval)) {
        cnt = filtered.filter(d => bval.includes(d.brand)).length;
      } else {
        cnt = filtered.filter(d => d.brand === bval).length;
      }
    }
    tab.querySelector('.count').textContent = cnt > 0 ? ` (${cnt})` : '';
  });
}

// === Sort ===
document.getElementById('sortBtn').addEventListener('click', () => {
  sortAsc = !sortAsc;
  document.getElementById('sortBtn').textContent = sortAsc ? '가격 ↑' : '가격 ↓';
  applyBrandFilter();
});

// === Calc ===
function setCalcPrice(price) {
  document.getElementById('calcPrice').value = price;
  document.getElementById('calcPanel').classList.add('show');
  document.getElementById('calcToggle').style.display = 'block';
  updateCalc();
}

function updateCalc() {
  const price = parseFloat(document.getElementById('calcPrice').value) || 0;
  const qty = parseInt(document.getElementById('calcQty').value) || 4;
  const disc = parseFloat(document.getElementById('calcDiscount').value) || 0;
  const discounted = Math.round(price * (1 - disc / 100));
  const total = discounted * qty;
  document.getElementById('calcFinal').textContent = total.toLocaleString() + ' 원';
  document.getElementById('calcDetail').textContent = `개당 ${discounted.toLocaleString()}원 × ${qty}개 (${disc}% 할인)`;
}

document.getElementById('calcPrice').addEventListener('input', updateCalc);
document.getElementById('calcQty').addEventListener('input', updateCalc);
document.getElementById('calcDiscount').addEventListener('input', updateCalc);
document.getElementById('calcToggleBtn').addEventListener('click', () => {
  document.getElementById('calcPanel').classList.toggle('show');
});

// === Recent Searches ===
function saveRecent(q) {
  let recent = JSON.parse(localStorage.getItem('tire_recent') || '[]');
  recent = recent.filter(r => r !== q);
  recent.unshift(q);
  recent = recent.slice(0, 8);
  localStorage.setItem('tire_recent', JSON.stringify(recent));
  loadRecent();
}

function loadRecent() {
  const area = document.getElementById('recentArea');
  const recent = JSON.parse(localStorage.getItem('tire_recent') || '[]');
  if (recent.length === 0) { area.innerHTML = ''; return; }
  area.innerHTML = '<span class="recent-label">최근</span>' + 
    recent.map(r => `<span class="recent-tag" onclick="searchSize('${r}')">${r}</span>`).join('');
}

// === Event handlers ===
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

input.addEventListener('input', () => {
  clearBtn.style.display = input.value ? 'block' : 'none';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch(input.value);
    input.blur();
  }
});

document.getElementById('searchBtn').addEventListener('click', () => {
  doSearch(input.value);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.style.display = 'none';
  currentQuery = '';
  filtered = [];
  document.getElementById('cardList').innerHTML = '';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('calcToggle').style.display = 'none';
  document.getElementById('calcPanel').classList.remove('show');
  document.getElementById('popularArea').style.display = '';
  input.focus();
});

function searchSize(s) {
  input.value = s;
  clearBtn.style.display = 'block';
  doSearch(s);
}

// === Init ===
loadData();
</script>
</body>
</html>
